career-profile:
  title: Career Profile
  summary: |
    Ten years turning Earth observation data into decisions, from a carbon sequestration thesis to production land cover and biomass maps to research at Mila. I now work on machine learning for biodiversity and climate: which samples to label first for species discovery, tree species from drone imagery, and how km-scale rainfall models transfer between regions. Before that I built GeoZarr pipelines for ESA's Earth Observation Processing Framework at DevelopmentSeed, and spent five years as Product Architect at Space Intelligence, where I co-designed the technical architecture that scaled from a five-person startup to a sixty-person company shipping global land cover and biomass products. Active open-source contributor to GDAL's Zarr v3 driver.
