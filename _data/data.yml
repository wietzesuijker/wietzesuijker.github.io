experiences:
  title: Experiences
  info:
  - role: Research Engineer
    time: 2026 - Present
    company: Mila, Quebec, Canada
    details: |
      Machine learning for biodiversity and climate research in IVADO's environment cluster, working with the Rolnick Lab, TraitLab (Université de Montréal) and the Pollock Lab.

      - Label prioritisation for species discovery: sole-author paper under review, with preregistered tests on the iWildCam and Snapshot Serengeti camera-trap datasets using frozen DINOv2 embeddings.
      - Precipitation downscaling: co-author of RainAtlas (data engineering and evaluation campaigns), a benchmark of UNet and diffusion models on radar products from the US, Europe and East Asia, run on the Mila and Digital Research Alliance of Canada clusters.
      - Tree species from drone imagery on Barro Colorado Island, Panama: retrained a PlantCLEF backbone inside a labelling loop, and made close-up image loading 14.6x faster in the lab's crown classifier.
      - Open tools for the Blitz the Gap biodiversity campaign: a sampling-priority planner, an identification-priority app, and species distribution maps served from object storage with an out-of-time check (fit on 2025 records, scored on 2026).
      - Mentored students in the labs through day-to-day collaboration on research code, cluster workflows and evaluation.
  - role: EO Data Engineer
    time: 2025
    company: DevelopmentSeed, Contractor, Remote
    details: |
      Open-source contributions to GeoZarr data pipelines and data models for the ESA Copernicus <a href="https://github.com/EOPF-Explorer">Earth Observation Processing Framework</a> (EOPF). Also contributed to the platform's Kubernetes/FluxCD deployment infrastructure.
  - role: Product Architect
    time: 2020 - 2025
    company: Space Intelligence, Edinburgh, UK
    details: |
      Co-authored the standardized project template and Python library powering all land cover and biomass map products. Designed ML pipelines (Random Forest, LightGBM) on Dask/Zarr/COG with Azure and AWS infrastructure (Terraform). Scaled the technical architecture as the team grew from five to over sixty.

      Project Highlight: Developed land cover and biomass data for <a href="https://www.apple.com/newsroom/2024/03/apples-restore-fund-cultivates-new-roots-in-the-atlantic-forest/">Apple's Restore Fund</a>. Presented our <a href="https://www.space-intelligence.com/land-cover-mapping/above-ground-biomass/">CarbonMapper biomass product</a> at Apple's ML conference in Cupertino, CA (2023).
  - role: GIS Specialist
    time: 2016 - 2020
    company: Nelen & Schuurmans, Utrecht, Netherlands
    details: |
      Technical lead on international development projects building data integration flows - e.g. connecting VanDerSat (now Planet) soil moisture data into a mobile app for pepper farmers in Indonesia.

      Led an internal group of developer-oriented consultants in foundational software and data engineering skills.

